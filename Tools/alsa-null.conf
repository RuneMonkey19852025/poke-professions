# ALSA override for the automated playtest launcher.
#
# The editor initialises FMOD during startup (AudioManager is loaded as an
# AssetDatabase singleton), and FMOD's ALSA probe calls snd_pcm_prepare() on
# the "default" PCM.  On this machine "default" is the PipeWire ALSA plugin and
# that call can block forever, which hangs editor startup before the GameScene
# ever opens.
#
# Pointing ALSA_CONFIG_PATH at this file sends the default PCM to the null
# device instead: init returns immediately, the editor runs with no audio,
# and nothing outside this process is touched.
#
#   ALSA_CONFIG_PATH="$PWD/Tools/alsa-null.conf" \
#     setsid nohup "$UNITY_EDITOR" -projectPath "$PWD" &
pcm.!default {
    type null
}
ctl.!default {
    type null
}
